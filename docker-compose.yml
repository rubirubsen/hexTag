version: '3.8'

services:
  hextag-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hextag-web
    restart: unless-stopped
    ports:
      # Format: "HOST_PORT:CONTAINER_PORT"
      # Du kannst den Host-Port ueber die .env Datei oder direkt hier aendern (z.B. 3080, 8085, etc.)
      - "${HEXTAG_PORT:-8080}:80"
    environment:
      - NODE_ENV=production
